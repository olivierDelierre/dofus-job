# Image publiée par la CI GitHub (onglet Packages du dépôt).
# Pour construire en local à la place : `docker compose up -d --build` (garde la section build).
services:
  atelier:
    image: ghcr.io/olivierdelierre/dofus-job:latest
    build: .
    container_name: dofus-atelier
    restart: unless-stopped
    ports:
      - "3001:3001"
    volumes:
      # Base SQLite (comptes et progression). Sur TrueNAS, pointe vers un dataset, ex. /mnt/tank/apps/dofus-atelier
      - ./data:/data
    environment:
      - TZ=Europe/Paris
      # Propriétaire des fichiers de /data (568 = « apps » sur TrueNAS SCALE, 1000 par défaut)
      - PUID=1000
      - PGID=1000
